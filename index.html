<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Selamat Ulang Tahun ke-21, Shanin</title>
<meta name="description" content="Sebuah kejutan kecil untuk hari istimewa Shanin.">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<style>
/* =========================================================
   SHANIN — 21st Birthday Surprise Site (single-file build)
   Design tokens generated with ui-ux-pro-max
   Palette   : Romantic Pink + White
   Display   : Great Vibes (script)
   Body/Head : Cormorant Garamond
   ========================================================= */

@import url('https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&display=swap');

:root{
  --color-primary:      #DB2777;
  --color-primary-soft: #F472B6;
  --color-background:   #FFFFFF;
  --color-surface:      #FFF6FA;
  --color-foreground:   #7A1E4A;
  --color-muted:        #A6577D;
  --color-border:       #FBCFE8;
  --color-ring:         #DB2777;

  --font-script: 'Great Vibes', cursive;
  --font-serif: 'Cormorant Garamond', serif;

  --space-xs: 8px;
  --space-sm: 16px;
  --space-md: 24px;
  --space-lg: 48px;
  --space-xl: 80px;
  --space-2xl: 128px;

  --radius-sm: 10px;
  --radius-md: 20px;
  --radius-lg: 32px;

  --ease-expo: cubic-bezier(0.16,1,0.3,1);
  --ease-soft: cubic-bezier(0.22,1,0.36,1);

  --glass-bg: rgba(255,255,255,0.55);
  --glass-bg-strong: rgba(255,255,255,0.7);
  --glass-border: rgba(255,255,255,0.65);
  --glass-blur: 22px;
  --glass-shadow: 0 20px 60px -20px rgba(122,30,74,0.22);
}

*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}

body{
  font-family:var(--font-serif);
  background:var(--color-background);
  color:var(--color-foreground);
  font-size:18px;
  line-height:1.6;
  overflow-x:hidden;
  position:relative;
  cursor:default;
}

img{max-width:100%;display:block;}
button{font-family:inherit;border:none;background:none;cursor:pointer;}
a{color:inherit;text-decoration:none;}
ul{list-style:none;}
::selection{background:var(--color-primary-soft);color:#fff;}

:focus-visible{
  outline:2px solid var(--color-ring);
  outline-offset:3px;
  border-radius:4px;
}

.container{max-width:1140px;margin:0 auto;padding:0 var(--space-md);}

/* ---------- Glassmorphism utility ---------- */
.glass{
  background:var(--glass-bg);
  backdrop-filter:blur(var(--glass-blur)) saturate(160%);
  -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(160%);
  border:1px solid var(--glass-border);
  box-shadow:var(--glass-shadow);
}
.glow-orb{
  position:absolute;
  border-radius:50%;
  filter:blur(90px);
  opacity:0.32;
  pointer-events:none;
  z-index:0;
}

.visually-hidden{
  position:absolute !important;width:1px;height:1px;
  overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;
}

/* ---------- Petals background layer ---------- */
#petals-layer{position:fixed;inset:0;pointer-events:none;z-index:5;overflow:hidden;}
.petal{position:absolute;top:-40px;width:16px;height:16px;opacity:0.85;will-change:transform;}
.petal svg{width:100%;height:100%;}

/* ---------- Intro gate ---------- */
#intro-gate{
  position:fixed;inset:0;z-index:100;
  background:radial-gradient(circle at 50% 30%, #FFF0F6 0%, #FFFFFF 65%);
  display:flex;align-items:center;justify-content:center;text-align:center;
}
.gate-inner{
  display:flex;flex-direction:column;align-items:center;gap:var(--space-md);
  padding:var(--space-xl) var(--space-lg);
  position:relative;
  border-radius:var(--radius-lg);
}
.gate-inner::before{
  content:'';
  position:absolute;
  width:340px;height:340px;
  background:radial-gradient(circle, rgba(244,114,182,0.35), transparent 70%);
  filter:blur(60px);
  z-index:-1;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
}
.envelope{width:220px;height:auto;position:relative;margin-bottom:var(--space-sm);perspective:600px;}
.envelope-img{width:100%;height:auto;display:block;filter:drop-shadow(0 18px 30px rgba(219,39,119,0.22));}
.gate-eyebrow{font-size:13px;letter-spacing:0.22em;text-transform:uppercase;color:var(--color-muted);font-weight:600;}
.gate-title{font-family:var(--font-script);font-size:clamp(2.6rem,7vw,4rem);color:var(--color-primary);line-height:1;}
.gate-sub{max-width:360px;color:var(--color-muted);font-size:16px;font-style:italic;}
.btn-open{
  margin-top:var(--space-sm);padding:16px 40px;min-height:52px;border-radius:999px;
  background:var(--color-primary);color:#fff;font-family:var(--font-serif);font-size:16px;font-weight:600;
  letter-spacing:0.03em;display:inline-flex;align-items:center;gap:10px;
  transition:transform 300ms var(--ease-expo), box-shadow 300ms var(--ease-expo);
  box-shadow:0 10px 30px -8px rgba(219,39,119,0.55);
}
.btn-open:hover{transform:translateY(-3px) scale(1.02);box-shadow:0 16px 36px -6px rgba(219,39,119,0.6);}
.btn-open:active{transform:translateY(0) scale(0.98);}

/* ---------- Side progress dots ---------- */
#section-nav{
  position:fixed;right:24px;top:50%;transform:translateY(-50%);z-index:40;
  display:flex;flex-direction:column;gap:16px;opacity:0;transition:opacity 500ms var(--ease-expo);
  padding:16px 10px;
  border-radius:999px;
  background:rgba(255,255,255,0.35);
  backdrop-filter:blur(14px) saturate(160%);
  -webkit-backdrop-filter:blur(14px) saturate(160%);
  border:1px solid rgba(255,255,255,0.55);
  box-shadow:0 10px 30px -12px rgba(122,30,74,0.25);
}
#section-nav.visible{opacity:1;}
#section-nav a{
  width:10px;height:10px;border-radius:50%;border:1.5px solid var(--color-primary);
  display:block;transition:all 250ms var(--ease-expo);position:relative;
}
#section-nav a[aria-current="true"]{background:var(--color-primary);transform:scale(1.3);}
#section-nav a .dot-label{
  position:absolute;right:22px;top:50%;transform:translateY(-50%);font-size:12px;white-space:nowrap;
  background:var(--color-foreground);color:#fff;padding:4px 10px;border-radius:6px;opacity:0;
  pointer-events:none;transition:opacity 200ms;
}
#section-nav a:hover .dot-label,
#section-nav a:focus-visible .dot-label{opacity:1;}
@media(max-width:900px){#section-nav{display:none;}}

/* ---------- Sections shared ---------- */
main{position:relative;z-index:1;}
section{position:relative;padding:var(--space-2xl) 0;}
.eyebrow{font-size:13px;letter-spacing:0.22em;text-transform:uppercase;color:var(--color-primary);font-weight:600;margin-bottom:var(--space-xs);}
.section-title{font-family:var(--font-script);font-size:clamp(2.4rem,5vw,3.6rem);color:var(--color-foreground);line-height:1.1;margin-bottom:var(--space-sm);}
.section-desc{max-width:520px;color:var(--color-muted);font-size:17px;font-style:italic;}
.divider-heart{width:26px;height:26px;margin:var(--space-md) auto;color:var(--color-primary);}

/* ---------- Hero ---------- */
#hero{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding-top:var(--space-xl);position:relative;overflow:hidden;}

/* ---------- Peeking character illustration ---------- */
.peek-char{
  position:absolute;
  z-index:0;
  pointer-events:none;
  opacity:0.92;
  filter:drop-shadow(0 20px 40px rgba(122,30,74,0.12));
}
.peek-char img{width:100%;height:100%;object-fit:contain;display:block;}
.peek-char.peek-hero{
  width:min(46vw,420px);
  height:min(46vw,420px);
  right:-9%;
  bottom:-6%;
}
.peek-char.peek-closing{
  width:min(34vw,300px);
  height:min(34vw,300px);
  left:-8%;
  bottom:-8%;
}
@media(max-width:640px){
  .peek-char.peek-hero{width:64vw;height:64vw;right:-16%;bottom:-2%;opacity:0.55;}
  .peek-char.peek-closing{width:46vw;height:46vw;left:-12%;bottom:-6%;opacity:0.5;}
}
.hero-frame{display:flex;flex-direction:column;align-items:center;gap:var(--space-xs);}
.hero-kicker{font-family:var(--font-serif);font-style:italic;font-size:18px;color:var(--color-muted);letter-spacing:0.04em;}
.hero-number{
  font-family:var(--font-serif);font-weight:700;font-size:clamp(7rem,26vw,15rem);line-height:0.85;
  background:linear-gradient(160deg,var(--color-primary),var(--color-primary-soft));
  -webkit-background-clip:text;background-clip:text;color:transparent;position:relative;
}
.hero-name{font-family:var(--font-script);font-size:clamp(3.5rem,10vw,6.5rem);color:var(--color-primary);margin-top:-10px;}

/* ---------- Sparkle name effect ---------- */
.sparkle-name{position:relative;display:inline-block;}
.sparkle{
  position:absolute;
  pointer-events:none;
  z-index:3;
  will-change:transform,opacity;
}
.sparkle svg{width:100%;height:100%;display:block;}
.hero-date{font-size:15px;letter-spacing:0.15em;text-transform:uppercase;color:var(--color-muted);margin-top:var(--space-sm);}
.hero-scroll{margin-top:var(--space-lg);display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--color-muted);font-size:12px;letter-spacing:0.18em;text-transform:uppercase;}
.scroll-line{width:1px;height:46px;background:linear-gradient(var(--color-primary), transparent);position:relative;overflow:hidden;}
.scroll-line::after{
  content:'';position:absolute;top:-46px;left:0;width:100%;height:46px;
  background:linear-gradient(var(--color-primary), transparent);animation:scrollDrop 2.2s ease-in-out infinite;
}
@keyframes scrollDrop{0%{transform:translateY(0);}100%{transform:translateY(92px);}}

/* ---------- Scroll text reveal ---------- */
.reveal-section{
  position:relative;
  background:linear-gradient(180deg,#5B1638,#7A1E4A);
  padding:var(--space-2xl) 0;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:60vh;
}
.reveal-sticky{
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0 var(--space-md);
  position:relative;
  width:100%;
}
.reveal-text{
  max-width:820px;
  text-align:center;
  font-family:var(--font-serif);
  font-style:italic;
  font-weight:500;
  font-size:clamp(1.6rem,4.2vw,2.9rem);
  line-height:1.55;
}
.reveal-word{
  color:rgba(255,255,255,0.16);
}
.reveal-eyebrow{
  position:absolute;
  top:calc(var(--space-lg) * -1);
  left:50%;
  transform:translateX(-50%);
  text-align:center;
  font-size:12px;
  letter-spacing:0.22em;
  text-transform:uppercase;
  color:rgba(255,255,255,0.75);
  background:rgba(255,255,255,0.12);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,0.2);
  padding:8px 18px;
  border-radius:999px;
  white-space:nowrap;
}
@media (prefers-reduced-motion: reduce){
  .reveal-word{color:#fff !important;}
}

/* ---------- Letter section ---------- */
#letter{background:var(--color-surface);position:relative;overflow:hidden;}
#letter .glow-orb-a{width:420px;height:420px;background:#F9A8D4;top:-120px;left:-140px;}
#letter .glow-orb-b{width:360px;height:360px;background:#DB2777;opacity:0.18;bottom:-100px;right:-120px;}
.letter-wrap{
  max-width:680px;margin:0 auto;border-radius:var(--radius-lg);
  padding:var(--space-xl) var(--space-lg);
  position:relative;
}
.letter-wrap::before{
  content:'';position:absolute;top:0;left:0;right:0;height:6px;
  background:linear-gradient(90deg,var(--color-primary-soft),var(--color-primary),var(--color-primary-soft));
  border-radius:var(--radius-lg) var(--radius-lg) 0 0;
}
.letter-greeting{font-family:var(--font-script);font-size:2.4rem;color:var(--color-primary);margin-bottom:var(--space-sm);}
.letter-body p{font-size:19px;color:#5B2740;margin-bottom:var(--space-sm);}
.letter-signoff{margin-top:var(--space-lg);text-align:right;font-style:italic;color:var(--color-muted);}
.letter-signoff .name{display:block;font-family:var(--font-script);font-size:2rem;color:var(--color-primary);margin-top:4px;}

/* ---------- Gallery ---------- */
#gallery{text-align:center;}
.gallery-head{margin-bottom:var(--space-xl);}
.gallery-grid{
  max-width:1000px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);
  grid-auto-rows:14px;gap:var(--space-sm);text-align:left;
}
.polaroid{
  background:#fff;padding:10px 10px 46px;border-radius:8px;
  box-shadow:0 24px 48px -22px rgba(122,30,74,0.28);border:1px solid var(--color-border);
  cursor:pointer;transition:transform 450ms var(--ease-soft), box-shadow 450ms var(--ease-soft);position:relative;
}
.polaroid img{border-radius:3px;width:100%;height:100%;object-fit:cover;}
.polaroid figcaption{
  position:absolute;bottom:12px;left:0;right:0;text-align:center;
  font-family:var(--font-script);font-size:1.2rem;color:var(--color-primary);
}
.polaroid:hover{transform:translateY(-8px) rotate(0deg) scale(1.02);box-shadow:0 26px 44px -18px rgba(122,30,74,0.4);}

.polaroid:nth-child(1){grid-column:1/4;grid-row:1/30;transform:rotate(-3deg);}
.polaroid:nth-child(2){grid-column:4/7;grid-row:1/24;transform:rotate(2deg);}
.polaroid:nth-child(3){grid-column:1/3;grid-row:30/54;transform:rotate(2.5deg);}
.polaroid:nth-child(4){grid-column:3/7;grid-row:24/48;transform:rotate(-1.5deg);}
.polaroid:nth-child(5){grid-column:1/4;grid-row:54/80;transform:rotate(1deg);}
.polaroid:nth-child(6){grid-column:4/7;grid-row:48/80;transform:rotate(-2deg);}

@media(max-width:760px){
  .gallery-grid{grid-template-columns:repeat(2,1fr);grid-auto-rows:16px;}
  .polaroid:nth-child(1){grid-column:1/3;grid-row:1/26;transform:rotate(-2deg);}
  .polaroid:nth-child(2){grid-column:1/2;grid-row:26/48;transform:rotate(2deg);}
  .polaroid:nth-child(3){grid-column:2/3;grid-row:26/50;transform:rotate(-1.5deg);}
  .polaroid:nth-child(4){grid-column:1/3;grid-row:50/76;transform:rotate(1.5deg);}
  .polaroid:nth-child(5){grid-column:1/2;grid-row:76/100;transform:rotate(-1deg);}
  .polaroid:nth-child(6){grid-column:2/3;grid-row:76/100;transform:rotate(2deg);}
}

/* ---------- Lightbox ---------- */
#lightbox{
  position:fixed;inset:0;z-index:90;background:rgba(122,30,74,0.92);
  display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;
  transition:opacity 300ms var(--ease-expo);padding:var(--space-md);
}
#lightbox.open{opacity:1;visibility:visible;}
#lightbox figure{max-width:min(90vw,560px);text-align:center;}
#lightbox img{border-radius:var(--radius-sm);max-height:70vh;width:auto;margin:0 auto;box-shadow:0 30px 60px rgba(0,0,0,0.4);}
#lightbox figcaption{color:#fff;font-family:var(--font-script);font-size:1.6rem;margin-top:var(--space-sm);}
.lightbox-btn{
  position:absolute;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,0.12);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,0.2);
  color:#fff;display:flex;align-items:center;justify-content:center;transition:background 300ms var(--ease-soft);
}
.lightbox-btn:hover{background:rgba(255,255,255,0.25);}
#lightbox-close{top:24px;right:24px;}
#lightbox-prev{left:24px;top:50%;transform:translateY(-50%);}
#lightbox-next{right:24px;top:50%;transform:translateY(-50%);}
@media(max-width:640px){#lightbox-prev,#lightbox-next{display:none;}}

/* ---------- Music section ---------- */
#music{background:var(--color-surface);text-align:center;}
.track-list{max-width:640px;margin:var(--space-lg) auto 0;display:flex;flex-direction:column;gap:var(--space-sm);text-align:left;}
.track-row{
  display:flex;align-items:center;gap:var(--space-sm);
  background:rgba(255,255,255,0.5);
  backdrop-filter:blur(16px) saturate(160%);
  -webkit-backdrop-filter:blur(16px) saturate(160%);
  border:1px solid rgba(255,255,255,0.6);
  box-shadow:0 12px 30px -18px rgba(122,30,74,0.25);
  border-radius:var(--radius-md);padding:14px 18px;transition:border-color 350ms var(--ease-soft), transform 350ms var(--ease-soft), background 350ms var(--ease-soft);
}
.track-row:hover{border-color:var(--color-primary-soft);transform:translateX(4px);}
.track-row.active{border-color:var(--color-primary);background:rgba(255,240,246,0.75);}
.track-play{
  width:44px;height:44px;min-width:44px;border-radius:50%;background:var(--color-primary);color:#fff;
  display:flex;align-items:center;justify-content:center;transition:transform 200ms var(--ease-expo);
}
.track-play:hover{transform:scale(1.08);}
.track-meta{flex:1;}
.track-meta .title{font-weight:600;font-size:16px;color:var(--color-foreground);}
.track-meta .caption{font-size:13px;font-style:italic;color:var(--color-muted);}
.eq{display:flex;align-items:flex-end;gap:3px;height:18px;width:20px;}
.eq span{width:3px;background:var(--color-primary);border-radius:2px;height:4px;}
.track-row.active .eq span{animation:eqBounce 1s ease-in-out infinite;}
.track-row.active .eq span:nth-child(2){animation-delay:0.15s;}
.track-row.active .eq span:nth-child(3){animation-delay:0.3s;}
@keyframes eqBounce{0%,100%{height:4px;}50%{height:16px;}}

/* Floating mini player */
#mini-player{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(140%);z-index:60;
  background:rgba(255,255,255,0.6);
  backdrop-filter:blur(20px) saturate(170%);
  -webkit-backdrop-filter:blur(20px) saturate(170%);
  border:1px solid rgba(255,255,255,0.65);border-radius:999px;padding:8px 10px 8px 8px;
  display:flex;align-items:center;gap:12px;box-shadow:0 20px 45px -14px rgba(122,30,74,0.32);
  transition:transform 450ms var(--ease-soft);max-width:calc(100vw - 32px);
}
#mini-player.visible{transform:translateX(-50%) translateY(0);}
#mini-toggle{
  width:44px;height:44px;border-radius:50%;background:var(--color-primary);color:#fff;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
#mini-info{min-width:0;}
#mini-info .title{font-size:13px;font-weight:600;color:var(--color-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px;}
#mini-progress{width:70px;height:3px;background:var(--color-border);border-radius:2px;overflow:hidden;}
#mini-progress-bar{height:100%;width:0%;background:var(--color-primary);}
#mini-mute{width:36px;height:36px;border-radius:50%;color:var(--color-muted);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
#mini-mute:hover{background:var(--color-surface);}

/* ---------- Surprise gift ---------- */
#surprise{text-align:center;}
.gift-stage{display:flex;flex-direction:column;align-items:center;gap:var(--space-md);margin-top:var(--space-lg);}
#gift-box{width:190px;height:170px;position:relative;cursor:pointer;}
#gift-box svg{width:100%;height:100%;overflow:visible;}
#surprise{position:relative;overflow:hidden;}
#surprise .glow-orb-c{width:380px;height:380px;background:#F472B6;top:10%;left:50%;transform:translateX(-50%);}
.gift-message{
  max-width:480px;
  background:rgba(255,255,255,0.55);
  backdrop-filter:blur(20px) saturate(170%);
  -webkit-backdrop-filter:blur(20px) saturate(170%);
  border:1px solid rgba(255,255,255,0.65);border-radius:var(--radius-md);
  box-shadow:0 20px 50px -20px rgba(122,30,74,0.28);
  padding:var(--space-md) var(--space-lg);font-style:italic;color:#5B2740;opacity:0;transform:translateY(16px);
  transition:opacity 600ms var(--ease-soft), transform 600ms var(--ease-soft);pointer-events:none;
}
.gift-message.show{opacity:1;transform:translateY(0);pointer-events:auto;}
.gift-hint{font-size:13px;color:var(--color-muted);letter-spacing:0.05em;}

/* ---------- Closing ---------- */
#closing{text-align:center;background:linear-gradient(180deg,#FFFFFF,var(--color-surface));position:relative;overflow:hidden;}
.closing-quote{
  max-width:600px;margin:0 auto;font-family:var(--font-script);font-size:clamp(1.8rem,4vw,2.6rem);
  color:var(--color-primary);line-height:1.3;
}
.closing-from{margin-top:var(--space-lg);color:var(--color-muted);font-style:italic;}

footer{text-align:center;padding:var(--space-lg) var(--space-md);font-size:13px;color:var(--color-muted);border-top:1px solid var(--color-border);}

/* ---------- Reduced motion ---------- */
@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto;}
  *{animation-duration:0.01ms !important;animation-iteration-count:1 !important;transition-duration:0.01ms !important;}
  #petals-layer{display:none;}
}
</2
